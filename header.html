<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nashville Time and Sunset</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .card{position:absolute;inset:6px;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,#0f1115 0%,#171a21 55%,#1d1a1f 100%);
    border:1px solid rgba(255,255,255,0.07);
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    display:flex;align-items:stretch;color:#f5f5f7;}
  .glow{position:absolute;right:-12%;bottom:-60%;width:60%;height:140%;
    background:radial-gradient(closest-side,rgba(255,140,60,0.22),rgba(255,140,60,0) 70%);
    pointer-events:none;}
  .panel{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:0 6%;position:relative;z-index:1;min-width:0;}
  .divider{width:1px;height:46%;align-self:center;background:rgba(255,255,255,0.12);position:relative;z-index:1;}
  .label{font-size:clamp(9px,1.6vh + 0.4vw,13px);letter-spacing:0.18em;text-transform:uppercase;
    color:rgba(245,245,247,0.55);font-weight:600;}
  .big{font-size:clamp(26px,18vh + 1vw,84px);font-weight:600;letter-spacing:-0.03em;
    line-height:1.02;margin:0.12em 0 0.1em;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .big .ampm{font-size:0.38em;font-weight:500;letter-spacing:0;margin-left:0.18em;
    color:rgba(245,245,247,0.6);}
  .sub{font-size:clamp(10px,2.4vh + 0.4vw,16px);color:rgba(245,245,247,0.6);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .sunset .big{color:#ffb070;}
  .sunset .big .ampm{color:rgba(255,176,112,0.7);}
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="panel">
    <div class="label">Nashville &middot; Central Time</div>
    <div class="big" id="time">--:--</div>
    <div class="sub" id="date"></div>
  </div>
  <div class="divider"></div>
  <div class="panel sunset">
    <div class="label">Sunset</div>
    <div class="big" id="sunset">--:--</div>
    <div class="sub" id="sunsub"></div>
  </div>
</div>
<script>
var TZ = 'America/Chicago', LAT = 36.1627, LON = -86.7816;

// NOAA solar calculation: returns sunset as a Date (UTC instant) for the given local calendar date.
function sunEvent(y, m, d, rising){
  var rad = Math.PI/180, zenith = 90.833;
  var N = Math.floor(275*m/9) - Math.floor((m+9)/12)*(1+Math.floor((y-4*Math.floor(y/4)+2)/3)) + d - 30;
  var lngHour = LON/15;
  var t = N + ((rising?6:18) - lngHour)/24;
  var M = 0.9856*t - 3.289;
  var L = (M + 1.916*Math.sin(M*rad) + 0.020*Math.sin(2*M*rad) + 282.634 + 360) % 360;
  var RA = Math.atan(0.91764*Math.tan(L*rad))/rad; RA = (RA + 360) % 360;
  RA = (RA + Math.floor(L/90)*90 - Math.floor(RA/90)*90)/15;
  var sinDec = 0.39782*Math.sin(L*rad), cosDec = Math.cos(Math.asin(sinDec));
  var cosH = (Math.cos(zenith*rad) - sinDec*Math.sin(LAT*rad))/(cosDec*Math.cos(LAT*rad));
  var H = Math.acos(cosH)/rad; if (rising) H = 360 - H; H /= 15;
  var T = H + RA - 0.06571*t - 6.622;
  var UT = ((T - lngHour) % 24 + 24) % 24;
  var ms = Date.UTC(y, m-1, d) + UT*3600000;
  // UT may belong to the next UTC day for evening events in the Americas
  if (!rising && UT < 12) ms += 86400000;
  return new Date(ms);
}

function parts(date, opts){
  var o = {}; new Intl.DateTimeFormat('en-US', Object.assign({timeZone:TZ}, opts))
    .formatToParts(date).forEach(function(p){ o[p.type] = p.value; }); return o;
}
function fmtTime(date){
  var p = parts(date, {hour:'numeric', minute:'2-digit', hour12:true});
  return p.hour + ':' + p.minute + '<span class="ampm">' + p.dayPeriod + '</span>';
}
function localYMD(date){
  var p = parts(date, {year:'numeric', month:'numeric', day:'numeric'});
  return [+p.year, +p.month, +p.day];
}
function dur(ms){
  var mins = Math.round(ms/60000), h = Math.floor(mins/60), m = mins%60;
  return (h ? h + 'h ' : '') + m + 'm';
}

function tick(){
  var now = new Date();
  document.getElementById('time').innerHTML = fmtTime(now);
  document.getElementById('date').textContent = new Intl.DateTimeFormat('en-US',
    {timeZone:TZ, weekday:'long', month:'long', day:'numeric'}).format(now);

  var ymd = localYMD(now);
  var set = sunEvent(ymd[0], ymd[1], ymd[2], false);
  var sub;
  if (now < set) {
    sub = 'Golden hour in ' + dur(Math.max(0, set - now - 3600000)) + ' · sets in ' + dur(set - now);
    if (set - now <= 3600000) sub = 'Golden hour now · sets in ' + dur(set - now);
  } else {
    var t = new Date(now.getTime() + 86400000), ty = localYMD(t);
    var rise = sunEvent(ty[0], ty[1], ty[2], true);
    set = sunEvent(ty[0], ty[1], ty[2], false);
    sub = 'Tomorrow · sunrise ' + fmtTime(rise).replace(/<[^>]+>/g, ' ');
  }
  document.getElementById('sunset').innerHTML = fmtTime(set);
  document.getElementById('sunsub').textContent = sub;
}
tick(); setInterval(tick, 1000);
if (typeof module !== 'undefined') module.exports = {sunEvent: sunEvent};
</script>
</body>
</html>
