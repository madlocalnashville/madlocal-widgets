<script>
// Scale the widget down so it always fits inside the Notion embed box without scrolling.
(function(){
  var wrap = document.getElementById('wrap');
  var last = '';
  function fit(){
    var vw = window.innerWidth, vh = window.innerHeight;
    wrap.style.transform = 'none';
    wrap.style.width = vw + 'px';
    var s = 1;
    for (var i = 0; i < 4; i++) {
      var h = wrap.scrollHeight;
      if (!h) return;
      s = Math.min(1, vh / h);
      wrap.style.width = (vw / s) + 'px';
    }
    var t = 'scale(' + s + ')';
    if (t !== last) { last = t; }
    wrap.style.transform = t;
  }
  window.addEventListener('resize', fit);
  setInterval(fit, 1000);
  fit();
})();
</script>
</body>
